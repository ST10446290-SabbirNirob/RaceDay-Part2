name: RaceDay API Build and Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay-Part2.sln

      - name: Build API and tests
        run: dotnet build RaceDay-Part2.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay-Part2.sln --configuration Release --no-build --verbosity normal
